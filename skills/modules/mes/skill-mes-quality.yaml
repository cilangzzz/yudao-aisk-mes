# 依赖关系
# ============================================
dependencies:
  # 内部依赖
  internal:
    - module: "system"
      api: "AdminUserApi"
      purpose: "获取检验员、处理人、验证人信息"

  # 外部依赖
  external:
    - name: "MyBatis-Plus"
      purpose: "ORM 框架，简化数据库操作"

